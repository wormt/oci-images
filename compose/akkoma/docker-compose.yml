---
name: 'akkoma'
version: '3.9'

x-podman:
  in_pod: false

services:
  psql:
    image: postgres:17.6-alpine3.22
    container_name: psql
    # command: ['-d', '5', '-c', 'config_file=/etc/postgresql/postgresql.conf']
    # command: "sleep 60000"
    shm_size: 4gb
    restart: on-failure:10
    # restart: always
    userns_mode: "keep-id:uid=70,gid=70"
    environment: {
      POSTGRES_DB: $PSQL_DB,
      POSTGRES_USER: $PSQL_USER,
      POSTGRES_PASSWORD: /run/secrets/pg_pass,
    }
    secrets:
      - pg_pass
    volumes:
      - type: bind
        source: ./pgconf
        target: /etc/postgresql
        bind:
          selinux: z
        create_host_path: true
      - type: bind
        source: ./pgdata
        target: /var/lib/postgresql/data
        bind:
          selinux: Z
        create_host_path: true
    healthcheck:
      test: pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      interval: 8s
      timeout: 3s
      retries: 5
    networks:
      akkoma-psql:

  akkoma:
    depends_on:
      - psql
    # image: docker.io/wormt/akkoma:latest
    image: localhost/akkoma:latest
    build:
      dockerfile: ./Dockerfile
    container_name: akkoma
    # command: sleep 60000
    restart: on-failure:10
    # restart: always
    userns_mode: "keep-id:uid=1000,gid=1000"
    ports:
      - "4000:4000/tcp"
    volumes:
      - type: bind
        source: ./config
        target: /etc/akkoma
        bind:
          selinux: Z
          create_host_path: true
      - type: bind
        source: ./static
        target: /var/lib/akkoma/static
        bind:
          selinux: Z
          create_host_path: true
      - type: volume
        source: akkoma-uploads
        target: /var/lib/akkoma/uploads
        x-driver_opts: U
    networks:
      akkoma-psql:

volumes:
  akkoma-pgdata: {name: "akkoma-pgdata"}
  akkoma-pgconf: {name: "akkoma-pgconf"}
  akkoma-uploads: {name: "akkoma-uploads"}

networks:
  akkoma-psql: {name: "akkoma-psql"}

secrets:
  pg_pass: {external: true}
