name: Build mumble using Dockerfile
on: [push]

jobs:
  build:
    name: Build mumble
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v3
        with:
          image: ghcr.io/${{ github.repository_owner }}/mumble
          tags: latest ${{ github.sha }}
          context: ./mumble
          containerfiles: |
            ./mumble/Dockerfile
