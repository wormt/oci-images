name: Build ansible-leap using Containerfile
on:
  push:
    paths:
      - ansible/leap/**
      - .github/workflows/buildah-ansible-leap.yml

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build ansible-leap
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v3
        with:
          image: ghcr.io/${{ github.repository_owner }}/ansible-leap
          tags: latest ${{ github.sha }}
          context: ./ansible/leap
          containerfiles: |
            ./ansible/leap/Containerfile

      - name: Push To quay.io
        id: push-to-quay
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
