name: Build ansible-alma using Containerfile
on:
  push:
    paths:
      - ansible/alma/**
      - .github/workflows/buildah-ansible-alma.yml

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ansible-alma
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        id: buildah
        uses: redhat-actions/buildah-build@v3
        with:
          image: ansible-alma
          tags: latest ${{ github.sha }}
          context: ./ansible/alma
          containerfiles: |
            ./ansible/alma/Containerfile

      - name: Push To ghcr
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
