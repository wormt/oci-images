name: Build akkoma using Dockerfile
on:
  push:
    paths:
      - akkoma/**
      - .github/workflows/buildah-akkoma.yml

env:
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ github.token }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build akkoma
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        id: buildah
        uses: redhat-actions/buildah-build@v3
        with:
          image: akkoma
          tags: latest ${{ github.sha }}
          context: ./akkoma
          containerfiles: |
            ./akkoma/Dockerfile

      - name: Push To ghcr
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.buildah.outputs.image }}
          tags: ${{ steps.buildah.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
