name: Build ansible-debian using Containerfile
on: [push]

jobs:
  build:
    name: Build ansible-debian
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v3
        with:
          image: ghcr.io/${{ github.repository_owner }}/ansible-debian
          tags: latest ${{ github.sha }}
          context: ./ansible/debian
          containerfiles: |
            ./ansible/debian/Containerfile
