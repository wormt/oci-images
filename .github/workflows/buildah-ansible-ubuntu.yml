name: Build ansible-ubuntu using Containerfile
on: [push]

jobs:
  build:
    name: Build ansible-ubuntu
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v3
        with:
          image: ghcr.io/${{ github.repository_owner }}/ansible-ubuntu
          tags: latest ${{ github.sha }}
          context: ./ansible/ubuntu
          containerfiles: |
            ./ansible/ubuntu/Containerfile
